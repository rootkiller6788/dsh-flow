# dsh-flow serves two canvases from the existing DSH Web Server:
#   /dsh-flow/      the team canvas (members + task dependency DAG), which polls
#                   dsh-agent-teams' /state endpoint. Read-only: it never writes
#                   agent-teams state.
#   /dsh-flow/map/  the session map (conversation graph), backed by a local
#                   workspace store under the DSH home directory.
- insert:
    - id: dsh-flow
      name: dsh-flow
      config:
        # A profile can override this path in its own cordis.patch.yml.
        dataFile: !!js dshHomePath('flow/workspaces.json')
        autoProjection: true
        projectionWorkspaceTitle: DSH 任务
        # Extra authorities the /dsh-flow Host check accepts (host or host:port);
        # localhost and 127.0.0.1 are always allowed.
        trustedHosts: []
